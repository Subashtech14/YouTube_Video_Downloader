name: AnySave
options:
  bundleIdPrefix: app.anysave
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AnySave:
    type: application
    platform: iOS
    sources: [AnySave]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.anysave.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AnySave
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: AnySave/Info.plist
      properties:
        NSLocalNetworkUsageDescription: AnySave connects to the AnySave server running on your computer over your Wi-Fi.
        NSPhotoLibraryAddUsageDescription: AnySave saves downloaded videos to your Photos when you ask it to.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: app.anysave.ios
            CFBundleURLSchemes: [anysave]
